[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runforge"
version = "0.1.0"
description = "Plan and run reproducible source-captured experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
runforge = "runforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "C",
  "E",
  "F",
  "I",
  "W",
  "PL",
  "N",
  "UP",
  "FIX",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2

